
name: Hello World CI Pipeline

on:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Print build message
        run: echo "Build job is running!"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Print test message
        run: echo "Test job is running!"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Print deploy message
        run: echo "Deploy job is running!"
